name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual runs from any branch (pick the branch in the "Run workflow" dropdown).
  workflow_dispatch:

# Deployment (Vercel) is intentionally not wired up yet — CI only.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  backend:
    name: Backend (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Caches cargo registry + target dir; keys off Cargo.lock automatically.
      - uses: Swatinem/rust-cache@v2

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-tiny-titanet-v1

      - name: Fetch test models
        run: ./scripts/fetch-models.sh tiny

      # rust-cache prunes the native shared libraries produced by the ort-sys
      # (ONNX Runtime, downloaded) and sherpa-rs-sys (cmake-built) build scripts,
      # but their "fresh" fingerprints survive — cargo then skips the build
      # scripts and linking fails with `unable to find library -lonnxruntime /
      # -lsherpa-onnx-c-api`. Deleting their build dirs + fingerprints forces the
      # build scripts to re-run each job while keeping the (much bigger)
      # whisper.cpp and dependency compilation cached.
      - name: Regenerate cache-pruned native libraries
        run: |
          rm -rf target/debug/build/ort-sys-* target/debug/build/sherpa-rs-sys-*
          rm -rf target/debug/.fingerprint/ort-sys-* target/debug/.fingerprint/sherpa-rs-sys-*

      - name: Run tests
        # Single-threaded: the whisper/speaker/pipeline tests run real
        # inference and are memory-heavy on shared runners.
        run: cargo test -- --test-threads=1
